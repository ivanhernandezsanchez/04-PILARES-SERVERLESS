service: festival-control-api
frameworkVersion: ~4.45.0
 
provider:
  name: aws
  runtime: nodejs22.x
 
plugins:
  - serverless-offline
 
functions:
  hello:
    handler: dist/hello.handler
    events:
      - http:
          path: hello
          method: get
          cors: true
 
  getEvent:
    handler: dist/getEvent.handler
    events:
      - http:
          path: events/{id}
          method: get
          cors: true
 